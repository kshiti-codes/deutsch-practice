<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch üben</title>
<meta name="description" content="Interaktive Deutsch-Übungstests nach GER-Niveau.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: test catalogue. Header, level filter, card grid grouped by GER level. Same tokens as the tests. */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --ink: #1b2233;
  --ink-soft: #566079;
  --rule: #dfe3ea;
  --accent: #2647a8;
  --accent-soft: #e6ecfa;
  --ok: #1d7a4a;
  --ok-soft: #e3f3ea;
  --warn: #8a5a00;
  --warn-soft: #fff4d6;
  --f-display: "Zilla Slab", "Rockwell", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151d; --sheet: #1a1f2a; --ink: #e6e9f0; --ink-soft: #9aa3b8; --rule: #2d3442;
    --accent: #8fa8f0; --accent-soft: #232d48; --ok: #5cc48d; --ok-soft: #173326;
    --warn: #f0c26a; --warn-soft: #3a2f14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151d; --sheet: #1a1f2a; --ink: #e6e9f0; --ink-soft: #9aa3b8; --rule: #2d3442;
  --accent: #8fa8f0; --accent-soft: #232d48; --ok: #5cc48d; --ok-soft: #173326;
  --warn: #f0c26a; --warn-soft: #3a2f14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }

header { padding-block: 48px 8px; }
.eyebrow { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(34px, 7vw, 52px)/1.05 var(--f-display); margin: 8px 0 12px; text-wrap: balance; }
.lede { color: var(--ink-soft); max-width: 60ch; margin: 0; }

.levels { display: flex; flex-wrap: wrap; gap: 6px; margin: 28px 0 0; }
.levels button { font: 500 14px var(--f-body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.levels button:hover { border-color: var(--ink-soft); }
.levels button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.group { margin-top: 36px; }
.group-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
.group-head h2 { font: 700 24px/1.2 var(--f-display); margin: 0; }
.group-head span { font: 13px var(--f-mono); color: var(--ink-soft); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lvl { font: 700 15px var(--f-display); color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 6px; }
.status { font: 500 12px var(--f-mono); padding: 2px 8px; border-radius: 999px; color: var(--ink-soft); border: 1px solid var(--rule); white-space: nowrap; }
.status.done { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.status.started { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.card h3 { font: 600 21px/1.25 var(--f-display); margin: 0; text-wrap: balance; }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }
.card p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--paper); color: var(--ink-soft); }
.meta { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 13px var(--f-mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.go { font: 600 14px var(--f-body); color: var(--accent); }

.empty { margin-top: 36px; padding: 32px; border: 1px dashed var(--rule); border-radius: 12px; text-align: center; color: var(--ink-soft); }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="eyebrow">Übungstests · Deutsch als Fremdsprache</div>
    <h1>Deutsch üben</h1>
    <p class="lede">Wählen Sie einen Test. Die meisten Aufgaben werden sofort korrigiert, Schreibaufgaben bewertet Ihre Lehrkraft. Ihr Fortschritt wird nur in diesem Browser gespeichert.</p>
    <div class="levels" id="levels" role="group" aria-label="Niveau filtern" hidden></div>
  </header>

  <div id="catalog"></div>
  <div class="empty" id="empty" hidden>Für dieses Niveau gibt es noch keine Tests.</div>

  <footer>
    <span id="count"></span>
  </footer>
</main>

<script src="tests.js"></script>
<script>
(function () {
  "use strict";
  var ORDER = ["A1.1", "A1.2", "A1", "A2.1", "A2.2", "A2", "B1.1", "B1.2", "B1", "B2.1", "B2.2", "B2", "C1", "C2"];
  var tests = (window.TESTS || []).slice();
  var filter = "Alle";

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function rank(l) { var i = ORDER.indexOf(l); return i < 0 ? 99 : i; }
  function mainLevel(l) { return String(l).slice(0, 2); }

  function status(t) {
    try {
      var s = JSON.parse(localStorage.getItem(t.storageKey) || "null");
      if (!s) return null;
      if (s.submitted) return { cls: "done", text: typeof s.score === "number" ? "Abgegeben · " + s.score + "/" + (s.max || "?") : "Abgegeben", go: "Ergebnis ansehen" };
      if ((s.answers && Object.keys(s.answers).length) || (s.writing && s.writing.trim())) return { cls: "started", text: "Angefangen", go: "Weitermachen" };
    } catch (e) {}
    return null;
  }

  function card(t) {
    var st = status(t);
    return '<article class="card">' +
      '<div class="card-top"><span class="lvl">' + esc(t.level) + '</span><span class="status ' + (st ? st.cls : "") + '">' + esc(st ? st.text : "Neu") + '</span></div>' +
      '<h3><a href="' + esc(t.href) + '">' + esc(t.title) + '</a></h3>' +
      '<p>' + esc(t.description) + '</p>' +
      '<ul class="tags">' + (t.skills || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("") + '</ul>' +
      '<div class="meta"><span>' + (t.minutes ? t.minutes + " Min." : "") + (t.points ? " · " + t.points + " Punkte" : "") + '</span><span class="go">' + esc(st ? st.go : "Test starten") + ' →</span></div>' +
      '</article>';
  }

  function render() {
    var shown = tests.filter(function (t) { return filter === "Alle" || mainLevel(t.level) === filter; });
    var groups = {};
    shown.sort(function (a, b) { return rank(a.level) - rank(b.level) || String(a.title).localeCompare(b.title, "de"); })
      .forEach(function (t) { (groups[mainLevel(t.level)] = groups[mainLevel(t.level)] || []).push(t); });
    document.getElementById("catalog").innerHTML = Object.keys(groups).sort(function (a, b) { return rank(a) - rank(b); }).map(function (g) {
      var list = groups[g];
      return '<section class="group"><div class="group-head"><h2>Niveau ' + esc(g) + '</h2><span>' + list.length + (list.length === 1 ? " Test" : " Tests") + '</span></div>' +
        '<div class="grid">' + list.map(card).join("") + '</div></section>';
    }).join("");
    document.getElementById("empty").hidden = shown.length > 0;
    document.getElementById("count").textContent = tests.length + (tests.length === 1 ? " Test verfügbar" : " Tests verfügbar");
  }

  var levels = [];
  tests.forEach(function (t) { var l = mainLevel(t.level); if (levels.indexOf(l) < 0) levels.push(l); });
  levels.sort(function (a, b) { return rank(a) - rank(b); });
  if (levels.length > 1) {
    var box = document.getElementById("levels");
    box.hidden = false;
    box.innerHTML = ["Alle"].concat(levels).map(function (l) {
      return '<button type="button" data-l="' + esc(l) + '" aria-pressed="' + (l === filter) + '">' + esc(l) + '</button>';
    }).join("");
    box.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      filter = b.dataset.l;
      box.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render();
    });
  }

  render();
  window.addEventListener("pageshow", render);
})();
</script>
</body>
</html>
